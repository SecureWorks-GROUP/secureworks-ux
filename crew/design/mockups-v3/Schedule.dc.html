<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule, week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#C4481F}a:hover{color:#B5421C}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F8F6F3;color:#293C46;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-size:15px;line-height:1.35;display:flex;flex-direction:column">

<header style="padding:54px 20px 14px;background:#293C46;display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
<div style="display:flex;flex-direction:column;gap:8px">
<h1 style="margin:0;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">Schedule</h1>
<span aria-hidden="true" style="width:40px;height:3px;background:#F15A29"></span>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
<svg role="img" aria-label="SecureWorks Group" width="20" height="27" viewBox="0 0 123.14 164.55"><polygon fill="#FFFFFF" points="115.73 59.77 115.73 40.18 62.27 6.68 7.48 40.11 7.48 69.94 96.74 88.91 96.74 114.41 79.63 114.41 62.24 96.53 44.64 114.41 26.48 114.41 26.48 80.79 7.49 76.91 7.48 133.4 52.6 133.4 62.16 123.69 71.61 133.4 115.73 133.4 115.73 73.53 26.48 54.56 26.48 50.77 62.14 29.01 96.74 50.69 96.74 63.65 115.73 67.21 115.73 59.77"></polygon><rect fill="#F15A29" x="7.71" y="139.12" width="108.25" height="18.9"></rect></svg>
<a href="ScheduleMonth.dc.html" style="font-size:13px;font-weight:700;color:#FFFFFF;text-decoration:underline;text-underline-offset:3px">Set availability</a>
</div>
</header>

<div style="background:#FFFFFF;border-bottom:1px solid #D4DEE4;padding:10px 16px 4px;display:flex;flex-direction:column;gap:4px">
<div role="group" aria-label="Range" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:3px;overflow:hidden">
<a href="Schedule.dc.html" aria-current="page" style="height:44px;box-sizing:border-box;border:1px solid #293C46;background:#293C46;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">Week</a>
<a href="ScheduleMonth.dc.html" style="height:44px;box-sizing:border-box;border:1px solid #6F8796;background:#FFFFFF;color:#293C46;font-size:15px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">Month</a>
</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<button type="button" aria-label="Earlier week" style="width:44px;height:44px;border:0;background:none;color:#293C46;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size:15px;font-weight:800;font-variant-numeric:tabular-nums">9 to 15 Nov 2026</span>
<button type="button" aria-label="Later week" style="width:44px;height:44px;border:0;background:none;color:#293C46;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>

<div style="padding:6px 20px;font-size:13px;font-weight:700;color:#4C6A7C;font-variant-numeric:tabular-nums">5 days booked · 1 to confirm · 1 unavailable</div>

<main style="flex:1;min-height:0;overflow:hidden;background:#FFFFFF;border-top:1px solid #D4DEE4;display:flex;flex-direction:column">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<a href="Booking.dc.html" style="display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:5px 16px;border-bottom:1px solid #D4DEE4;text-decoration:none;color:#293C46;background: {{ d.rowBg }}">
<span style="display:flex;flex-direction:column;align-items:center">
<span style="font-size:12px;font-weight:800;color: {{ d.dowFg }}">{{ d.dow }}</span>
<span style="font-size:18px;font-weight:800;font-variant-numeric:tabular-nums">{{ d.dom }}</span>
</span>
<span style="display:flex;flex-direction:column;gap:1px;min-width:0">
<span style="display:flex;align-items:center;min-width:0"><span style="display:inline-flex;align-items:center;height:20px;padding:0 {{ d.tagPad }};margin-right: {{ d.tagGap }};box-sizing:border-box;border: {{ d.tagBorder }};background:#FFFFFF;color:#293C46;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap">{{ d.tag }}</span><span style="font-size:13px;font-weight:500;color:#4C6A7C;white-space:nowrap">{{ d.kind }}</span></span>
<span style="font-size:15px;font-weight:700">{{ d.place }}</span>
<span style="font-size:13px;color:#4C6A7C;font-variant-numeric:tabular-nums">{{ d.detail }}</span>
</span>
<span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:0;font-size:12px;font-weight:700;white-space:nowrap;background: {{ d.bg }};color: {{ d.fg }}">{{ d.status }}</span>
</a>
</sc-for>
</main>

<nav aria-label="Main" style="background:#FFFFFF;border-top:1px solid #D4DEE4;padding:0 8px 24px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))">
<a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Today</a>
<a href="Schedule.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid #293C46;font-size:12px;font-weight:800;color:#293C46;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="1"></rect><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"></path></svg>Schedule</a>
<a href="Jobs.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="1"></rect><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 13h17"></path></svg>Jobs</a>
<a href="Pay.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="11" rx="1"></rect><circle cx="12" cy="12" r="2.4"></circle></svg>Pay</a>
<a href="Profile.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>Profile</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var done = { status: 'Done', bg: '#EDF1F4', fg: '#293C46' };
var conf = { status: 'Confirmed', bg: '#E3F2EA', fg: '#1F6B45' };
var tent = { status: 'To confirm', bg: '#FBEFD6', fg: '#7A4F00' };
var off = { status: 'Unavailable', bg: '#EDF1F4', fg: '#293C46' };
var rows = [
['Mon', '9', 'SWF-26168 · Fencing', 'South Perth', '7:00 am to 3:30 pm · 8.0 h', done],
['Tue', '10', 'SWF-26168 · Fencing', 'South Perth', '7:00 am to 2:30 pm · 7.0 h', done],
['Wed', '11', 'SWP-26412 · Patio', 'Duncraig', '7:00 am to 3:30 pm · 8.0 h', done],
['Thu', '12', 'SWMS-261290 · Make safe', 'Morley', '1:00 pm to 3:30 pm · 2.5 h', done],
['Fri', '13', 'SWF-26767 · Fencing', 'Joondalup', 'Starts 7:00 am · with Henry F.', conf],
['Sat', '14', 'SWF-26767 · Fencing', 'Joondalup', 'Starts 7:00 am · with Henry F.', tent],
['Sun', '15', 'No booking', 'Day off', 'You marked this day unavailable', off]
];
var days = rows.map(function (r) {
var today = r[1] === '13';
return { dow: r[0], dom: r[1], tag: r[2].indexOf(' · ') > 0 ? r[2].split(' · ')[0] : '', kind: r[2].indexOf(' · ') > 0 ? r[2].split(' · ')[1] : r[2], tagPad: r[2].indexOf(' · ') > 0 ? '5px' : '0', tagGap: r[2].indexOf(' · ') > 0 ? '6px' : '0', tagBorder: r[2].indexOf(' · ') > 0 ? '1.5px solid #293C46' : '0 solid transparent', place: r[3], detail: r[4], status: r[5].status, bg: r[5].bg, fg: r[5].fg, rowBg: today ? '#FDF2EE' : '#FFFFFF', dowFg: today ? '#C4481F' : '#4C6A7C' };
});
return { days: days };
}
}
</script>
</body>
</html>
