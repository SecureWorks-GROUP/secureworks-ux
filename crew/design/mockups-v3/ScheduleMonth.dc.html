<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule, month</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#C4481F}a:hover{color:#B5421C}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F8F6F3;color:#293C46;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-size:15px;line-height:1.35;display:flex;flex-direction:column">

<header style="padding:54px 20px 14px;background:#293C46;display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
<div style="display:flex;flex-direction:column;gap:8px">
<h1 style="margin:0;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF">Schedule</h1>
<span aria-hidden="true" style="width:40px;height:3px;background:#F15A29"></span>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
<svg role="img" aria-label="SecureWorks Group" width="20" height="27" viewBox="0 0 123.14 164.55"><polygon fill="#FFFFFF" points="115.73 59.77 115.73 40.18 62.27 6.68 7.48 40.11 7.48 69.94 96.74 88.91 96.74 114.41 79.63 114.41 62.24 96.53 44.64 114.41 26.48 114.41 26.48 80.79 7.49 76.91 7.48 133.4 52.6 133.4 62.16 123.69 71.61 133.4 115.73 133.4 115.73 73.53 26.48 54.56 26.48 50.77 62.14 29.01 96.74 50.69 96.74 63.65 115.73 67.21 115.73 59.77"></polygon><rect fill="#F15A29" x="7.71" y="139.12" width="108.25" height="18.9"></rect></svg>
<a href="ScheduleMonth.dc.html" style="font-size:13px;font-weight:700;color:#FFFFFF;text-decoration:underline;text-underline-offset:3px">Set availability</a>
</div>
</header>

<div style="background:#FFFFFF;padding:12px 16px 4px;display:flex;flex-direction:column;gap:6px">
<div role="group" aria-label="Range" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:3px;overflow:hidden">
<a href="Schedule.dc.html" style="height:44px;box-sizing:border-box;border:1px solid #6F8796;background:#FFFFFF;color:#293C46;font-size:15px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">Week</a>
<a href="ScheduleMonth.dc.html" aria-current="page" style="height:44px;box-sizing:border-box;border:1px solid #293C46;background:#293C46;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">Month</a>
</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<button type="button" aria-label="Earlier month" style="width:44px;height:44px;border:0;background:none;color:#293C46;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size:15px;font-weight:800">November 2026</span>
<button type="button" aria-label="Later month" style="width:44px;height:44px;border:0;background:none;color:#293C46;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>

<div style="background:#FFFFFF;border-bottom:1px solid #D4DEE4;padding:0 10px 8px">
<div aria-hidden="true" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;font-weight:700;color:#4C6A7C;text-align:center;padding-bottom:4px">
<span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
</div>
<div role="group" aria-label="November 2026" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">
<sc-for list="{{ cells }}" as="c" hint-placeholder-count="30">
<button type="button" aria-label="{{ c.label }}" style="height:37px;padding:0;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:Plus Jakarta Sans,system-ui,sans-serif;grid-column-start: {{ c.col }};background: {{ c.cellBg }};border: {{ c.cellBorder }}">
<span style="width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;background: {{ c.numBg }};color: {{ c.numFg }}">{{ c.num }}</span>
<span style="width:18px;height:5px;border-radius:3px;box-sizing:border-box;background: {{ c.markBg }};border: {{ c.markBorder }}"></span>
</button>
</sc-for>
</div>
</div>

<main style="flex:1;min-height:0;overflow:hidden;padding:12px 16px;display:flex;flex-direction:column;gap:12px">

<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,0.85fr) minmax(0,0.85fr);white-space:nowrap;background:#FFFFFF;border:1px solid #D4DEE4;border-radius:0">
<div style="padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-right:1px solid #D4DEE4">
<span style="font-size:18px;font-weight:800;font-variant-numeric:tabular-nums">15</span>
<span style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#4C6A7C"><span aria-hidden="true" style="width:14px;height:5px;border-radius:3px;background:#293C46"></span>Booked</span>
</div>
<div style="padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-right:1px solid #D4DEE4">
<span style="font-size:18px;font-weight:800;font-variant-numeric:tabular-nums">3</span>
<span style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#4C6A7C"><span aria-hidden="true" style="width:14px;height:5px;border-radius:3px;box-sizing:border-box;background:#FBEFD6;border:1.5px solid #7A4F00"></span>To confirm</span>
</div>
<div style="padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-right:1px solid #D4DEE4">
<span style="font-size:18px;font-weight:800;font-variant-numeric:tabular-nums">3</span>
<span style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#4C6A7C"><span aria-hidden="true" style="width:10px;height:10px;border-radius:2px;background:#D4DEE4"></span>Off</span>
</div>
<div style="padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px">
<span style="font-size:18px;font-weight:800;font-variant-numeric:tabular-nums">3</span>
<span style="font-size:12px;font-weight:700;color:#4C6A7C">Free</span>
</div>
</div>

<section aria-label="Selected day" style="display:flex;flex-direction:column;gap:6px">
<h2 style="margin:0;padding:0 4px;font-size:12px;font-weight:700;color:#4C6A7C">Tue 17 Nov</h2>
<a href="Booking.dc.html" style="background:#FFFFFF;border:1px solid #D4DEE4;border-radius:0;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:#293C46">
<span style="display:flex;flex-direction:column;gap:1px;min-width:0">
<span style="display:flex;align-items:center;gap:6px"><span style="display:inline-flex;align-items:center;height:20px;padding:0 5px;box-sizing:border-box;border:1.5px solid #293C46;background:#FFFFFF;color:#293C46;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap">SWMS-261301</span><span style="font-size:13px;font-weight:500;color:#4C6A7C">Make safe</span></span>
<span style="font-size:15px;font-weight:700">Hillarys</span>
<span style="font-size:13px;color:#4C6A7C">Starts 9:00 am · with Dan R.</span>
</span>
<span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:0;font-size:12px;font-weight:700;white-space:nowrap;background:#FBEFD6;color:#7A4F00">To confirm</span>
</a>
</section>

<button type="button" style="height:48px;flex-shrink:0;border:1px solid #6F8796;border-radius:3px;background:#FFFFFF;color:#293C46;font:700 15px Plus Jakarta Sans,system-ui,sans-serif">Mark days unavailable</button>

</main>

<nav aria-label="Main" style="background:#FFFFFF;border-top:1px solid #D4DEE4;padding:0 8px 24px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))">
<a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Today</a>
<a href="Schedule.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid #293C46;font-size:12px;font-weight:800;color:#293C46;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="1"></rect><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"></path></svg>Schedule</a>
<a href="Jobs.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="1"></rect><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 13h17"></path></svg>Jobs</a>
<a href="Pay.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="11" rx="1"></rect><circle cx="12" cy="12" r="2.4"></circle></svg>Pay</a>
<a href="Profile.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>Profile</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var booked = [2, 3, 4, 5, 6, 9, 10, 11, 12, 13, 16, 18, 20, 23, 24];
var toConfirm = [14, 17, 19];
var off = [15, 27, 28];
var cells = [];
for (var d = 1; d <= 30; d++) {
var isBooked = booked.indexOf(d) >= 0;
var isTent = toConfirm.indexOf(d) >= 0;
var isOff = off.indexOf(d) >= 0;
var today = d === 13;
var selected = d === 17;
cells.push({
num: String(d),
label: d + ' November, ' + (isBooked ? 'booked' : isTent ? 'to confirm' : isOff ? 'unavailable' : 'free'),
col: d === 1 ? '7' : 'auto',
cellBg: isOff ? '#EDF1F4' : '#FFFFFF',
cellBorder: selected ? '2px solid #293C46' : '2px solid transparent',
numBg: today ? '#C4481F' : 'transparent',
numFg: today ? '#FFFFFF' : isOff ? '#4C6A7C' : '#293C46',
markBg: isBooked ? '#293C46' : isTent ? '#FBEFD6' : 'transparent',
markBorder: isTent ? '1.5px solid #7A4F00' : '0 solid transparent'
});
}
return { cells: cells };
}
}
</script>
</body>
</html>
