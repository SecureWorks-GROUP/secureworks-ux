<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timesheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#C4481F}a:hover{color:#B5421C}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F8F6F3;color:#293C46;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-size:15px;line-height:1.35;display:flex;flex-direction:column">

<header style="padding:54px 8px 6px;background:#293C46;display:grid;grid-template-columns:104px minmax(0,1fr) 104px;align-items:center">
<a href="Pay.dc.html" style="height:44px;display:flex;align-items:center;gap:2px;font-size:15px;font-weight:700;color:#FFFFFF;text-decoration:none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Pay</a>
<h1 style="margin:0;text-align:center;font-size:18px;font-weight:800;color:#FFFFFF">Timesheet</h1>
<span style="display:flex;justify-content:flex-end;padding-right:8px"><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:0;font-size:12px;font-weight:700;background:#EDF1F4;color:#293C46">Draft</span></span>
</header>

<div style="background:#FFFFFF;border-bottom:1px solid #D4DEE4;padding:0 16px 2px;display:flex;align-items:center;justify-content:space-between">
<button type="button" aria-label="Earlier week" style="width:44px;height:44px;border:0;background:none;color:#293C46;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size:15px;font-weight:800;font-variant-numeric:tabular-nums">Pay week 9 to 15 Nov 2026</span>
<button type="button" aria-label="Later week" style="width:44px;height:44px;border:0;background:none;color:#293C46;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">

<div aria-hidden="true" style="display:grid;grid-template-columns:40px minmax(0,1fr) 58px;gap:12px;padding:8px 16px 6px;font-size:12px;font-weight:700;color:#4C6A7C">
<span>Day</span><span>Job and time</span><span style="text-align:right">Hours</span>
</div>

<div style="background:#FFFFFF;border-top:1px solid #D4DEE4;display:flex;flex-direction:column">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<a href="ClockOff.dc.html" style="display:grid;grid-template-columns:40px minmax(0,1fr) 58px;gap:12px;align-items:center;min-height:70px;padding:6px 16px;box-sizing:border-box;border-bottom:1px solid #D4DEE4;text-decoration:none;color:#293C46;background: {{ r.rowBg }}">
<span style="display:flex;flex-direction:column">
<span style="font-size:12px;font-weight:700;color:#4C6A7C">{{ r.dow }}</span>
<span style="font-size:18px;font-weight:800;font-variant-numeric:tabular-nums">{{ r.dom }}</span>
</span>
<span style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.place }}</span>
<span style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;font-weight: {{ r.timeWeight }};color: {{ r.timeFg }}">{{ r.time }}</span>
<span style="display:flex;align-items:center;gap:6px;min-width:0"><span style="display:inline-flex;align-items:center;height:20px;padding:0 5px;box-sizing:border-box;border:1.5px solid #293C46;background:#FFFFFF;color:#293C46;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap">{{ r.tag }}</span><span style="font-size:13px;font-weight:500;color:#4C6A7C;white-space:nowrap">{{ r.kind }}</span></span>
</span>
<span style="font-size:18px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums">{{ r.hrs }}</span>
</a>
</sc-for>
<button type="button" style="height:44px;padding:0 16px;border:0;border-bottom:1px solid #D4DEE4;background:#FFFFFF;text-align:left;color:#C4481F;font:700 15px Plus Jakarta Sans,system-ui,sans-serif">Add a day or a job</button>
<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #D4DEE4">
<span style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:800">Total recorded</span><span style="font-size:13px;color:#4C6A7C">Friday still needs its times</span></span>
<span style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums">25.5 h</span>
</div>
</div>

<div style="margin-top:auto;padding:10px 16px 12px">
<a href="Invoice.dc.html" style="height:54px;border-radius:3px;background:#C4481F;color:#FFFFFF;font-weight:800;font-size:18px;text-decoration:none;display:flex;align-items:center;justify-content:center">Review invoice</a>
</div>

</main>

<nav aria-label="Main" style="background:#FFFFFF;border-top:1px solid #D4DEE4;padding:0 8px 24px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))">
<a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Today</a>
<a href="Schedule.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="1"></rect><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"></path></svg>Schedule</a>
<a href="Jobs.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="1"></rect><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 13h17"></path></svg>Jobs</a>
<a href="Pay.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid #293C46;font-size:12px;font-weight:800;color:#293C46;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="11" rx="1"></rect><circle cx="12" cy="12" r="2.4"></circle></svg>Pay</a>
<a href="Profile.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-top:3px solid transparent;font-size:12px;font-weight:700;color:#4C6A7C;text-decoration:none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>Profile</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var data = [
['Mon', '9', 'South Perth', 'SWF-26168 · Work order', '7:00 am to 3:30 pm · 30 min break', '', '8.0 h', 'ok'],
['Tue', '10', 'South Perth', 'SWF-26168 · Work order', '7:00 am to 2:30 pm · 30 min break', '', '7.0 h', 'ok'],
['Wed', '11', 'Duncraig', 'SWP-26412 · Group work order', '7:00 am to 3:30 pm · 30 min break', '', '8.0 h', 'ok'],
['Thu', '12', 'Morley', 'SWMS-261290 · Hourly', '1:00 pm to 3:30 pm · no break', '', '2.5 h', 'ok'],
['Fri', '13', 'Joondalup', 'SWF-26767 · Hourly', 'Add start and finish times', '', '', 'missing']
];
return { rows: data.map(function (r) {
var st = r[7];
return {
dow: r[0], dom: r[1], place: r[2], tag: r[3].split(' · ')[0], kind: r[3].split(' · ')[1], time: r[4], sub: r[5], hrs: r[6],
rowBg: st === 'missing' ? '#FDF2EE' : '#FFFFFF',
timeFg: st === 'missing' ? '#C4481F' : st === 'ahead' ? '#4C6A7C' : '#293C46',
timeWeight: st === 'missing' ? '800' : '500'
};
}) };
}
}
</script>
</body>
</html>
