<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#293C46">
  <title>SecureWorks — Add job photos</title>
  <!-- One job's photo upload, opened from a link (job-photos.html?jobId=<uuid>).
       The Trade app's own sign-in and upload calls; see modules/job-photos.js. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    window.SUPABASE_URL = 'https://kevgrhcjxspbxgovpmfl.supabase.co';
    window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtldmdyaGNqeHNwYnhnb3ZwbWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNTQxMDUsImV4cCI6MjA4NzkzMDEwNX0.lPUEvx8u98WL86PcMNv8yfLnd6OQKzTUOCsRewfQiZc';
  </script>
  <style>
    :root { --ink: #293C46; --mid: #5F7480; --line: #D5DDE2; --bg: #F4F6F7; --orange: #F15A29; --good: #155724; --bad: #9A3412; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: var(--ink); color: #fff; padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top)); font-weight: 700; font-size: 16px; }
    main { max-width: 520px; margin: 0 auto; padding: 16px; }
    .jp-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .jp-job { font-size: 17px; font-weight: 700; line-height: 1.3; }
    .jp-count { font-size: 14px; color: var(--mid); margin-top: 6px; }
    .jp-count.ok { color: var(--good); font-weight: 700; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    input[type=text], input[type=email], input[type=password] { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; margin-bottom: 12px; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 10px; background: var(--orange); color: #fff; font-size: 17px; font-weight: 700; }
    button:disabled { opacity: 0.55; }
    .jp-hint { font-size: 12px; color: var(--mid); margin: -6px 0 12px; }
    .jp-progress { font-size: 14px; color: var(--mid); margin-top: 10px; min-height: 18px; }
    .jp-outcome { font-size: 15px; font-weight: 700; margin-top: 6px; }
    .jp-outcome.good { color: var(--good); }
    .jp-outcome.bad { color: var(--bad); }
    .jp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
    .jp-thumb { position: relative; }
    .jp-thumb img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; opacity: 0.45; display: block; background: #E5EAED; }
    .jp-thumb.done img { opacity: 1; }
    .jp-badge { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .jp-thumb.done .jp-badge { background: #2E7D32; }
    .jp-thumb.failed .jp-badge { background: #C62828; }
    .jp-error { color: var(--bad); font-size: 14px; min-height: 18px; margin-bottom: 8px; }
    .jp-foot { font-size: 12px; color: var(--mid); text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <header>SecureWorks · Add job photos</header>

  <main>
  <section id="jpSignIn" style="display:none">
    <div class="jp-card">
      <form id="jpSignInForm">
        <label for="jpEmail">Email</label>
        <input type="email" id="jpEmail" autocomplete="username" inputmode="email">
        <label for="jpPassword">Password</label>
        <input type="password" id="jpPassword" autocomplete="current-password">
        <div class="jp-error" id="jpSignInError"></div>
        <button type="submit" id="jpSignInButton">Sign in</button>
      </form>
    </div>
    <div class="jp-foot">Your Trade app sign-in.</div>
  </section>

  <section id="jpMain" style="display:none">
    <div class="jp-card">
      <div class="jp-job" id="jpJob"></div>
      <div class="jp-count" id="jpCount"></div>
    </div>
    <div class="jp-card" id="jpUpload" style="display:none">
      <label for="jpLabel">What do these photos show? (optional)</label>
      <input type="text" id="jpLabel" maxlength="160" placeholder="e.g. Cabinetry before removal">
      <div class="jp-hint">Printed under the photos in the report.</div>
      <button type="button" id="jpPick">Choose photos</button>
      <input type="file" id="jpInput" accept="image/*" multiple style="display:none">
      <div class="jp-progress" id="jpProgress"></div>
      <div class="jp-outcome" id="jpOutcome"></div>
      <div class="jp-grid" id="jpGrid"></div>
    </div>
    <div class="jp-foot">Photos go on this visit of the job. This page sends nothing to anyone.</div>
  </section>
  </main>

  <script src="modules/job-photos.js?v=1"></script>
</body>
</html>
