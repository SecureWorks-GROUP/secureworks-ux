<title>Booking confirmation · offline fixture</title>
<link rel="stylesheet" href="../../../modules/ops-sales-booking.css">
<style>body{margin:0}header{padding:12px 20px;background:#293C46;color:white;font:14px Arial}header button{margin-left:10px;padding:6px}</style>
<header>Secure Ops · Booking · Synthetic fixture, all writes are fake
<button onclick="setReadState('read')">Read calendar</button><button onclick="setReadState('could_not_read')">Failed read</button><button onclick="setReadState('not_configured')">Not configured</button></header>
<div id="viewSales"><div id="salesBookingRoot"></div></div>
<script src="../../../modules/ops-sales-booking.js"></script><script src="read.js"></script><script src="api.js"></script>
<script>
document.body.classList.add('sales-booking-view-active');
const api = SalesBooking;
const data = makeBookingConfirmRead(api);
const backend = BookingConfirmFixtureAPI.create(api, data);
window.fakeWrites = backend.writes;
window.fakeReads = backend.reads;
window.SECUREWORKS_CLOUD = {auth:{getUser:()=>({id:api.RESOURCES.marnin.scoper_user_id})}};
window.opsPost = backend.post;
window.opsFetch = backend.read;
Object.assign(api.state, {resourceId:'marnin',weekStart:data.week_start,data,selectedId:'lead-a',opened:true});
window.setReadState = state => { data.booking_flow.calendar_read = {state,provider:'ghl',reason:state === 'read' ? '' : 'Synthetic provider state'}; api.render(); };
api.render();
</script></html>
